name: Imagen

# La imagen Docker de la instancia.
#
# - En cada PR y en cada push a main se CONSTRUYE sin publicar. Atrapa lo que
#   `pnpm build` no ve: el Dockerfile, el entrypoint y la etapa runner. Hasta
#   ahora el CI nunca construía la imagen, y el primero en enterarse de un
#   Dockerfile roto era quien desplegaba.
# - Al crear un tag `vX.Y.Z` se PUBLICA en GitHub Container Registry:
#   ghcr.io/kevinrivm/vocero-crm:X.Y.Z (y X.Y, y `latest` si no es
#   prerelease). Es lo que instala el starter: Coolify descarga la imagen en
#   vez de construirla en el VPS (minutos de build y RAM que un VPS chico no
#   tiene).
#
# El commit se hornea como build arg (SOURCE_COMMIT): es lo que hace que
# /api/health diga `commitVerified: true`.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Tres pushes seguidos a un PR no necesitan tres builds: manda el último. En
# main y en los tags no se cancela nada.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Solo se usa al publicar (tags). En un PR desde un fork GitHub lo baja a
  # lectura por su cuenta.
  packages: write

jobs:
  imagen:
    name: docker build${{ startsWith(github.ref, 'refs/tags/v') && ' · publicar' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Entrar a GHCR (solo al publicar)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Versión de package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha
            # War: cada push a main también publica `main` y la versión de
            # package.json (p. ej. 2.7.0), para no depender de crear tags.
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}

      # Solo amd64 por ahora: es lo que corren los VPS de la guía. arm64
      # (Oracle, Ampere) emulado con QEMU multiplica el tiempo del build; se
      # agrega cuando haya quien lo instale.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # War: cuando la imagen de `main` ya está publicada, le pide a Coolify que
  # redespliegue el CRM de War (app `vocero-crm` del equipo War, que usa el tag
  # `:main`). Así un merge a main llega solo a producción.
  #
  # Necesita dos secretos del repo (Settings → Secrets and variables → Actions):
  #   COOLIFY_URL   — URL del panel de Coolify, p. ej. https://coolify.gudlime.com.ar
  #   DEPLOY_WAR_COOLIFY_API — token del equipo War con permiso `deploy`
  #                            SOLAMENTE (también acepta COOLIFY_TOKEN)
  # Sin ellos, el paso avisa y termina en verde: no rompe el workflow.
  # Volver atrás: en Coolify, poner en la app el tag `sha-<commit anterior>`
  # y redesplegar.
  desplegar:
    name: desplegar en Coolify (War)
    needs: imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Un deploy a la vez: si llegan dos merges seguidos, el segundo espera.
    concurrency:
      group: desplegar-war
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.DEPLOY_WAR_COOLIFY_API || secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: znisfv3ruzuwspfsqcgm2vfq
    steps:
      - name: Pedir el redeploy
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::Faltan los secretos COOLIFY_URL / DEPLOY_WAR_COOLIFY_API: no se despliega solo. Redesplegá a mano en Coolify."
            exit 0
          fi
          url="${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"
          code=$(curl -sS -X POST -o respuesta.json -w '%{http_code}' \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" "$url")
          echo "Coolify respondió HTTP $code"
          # Solo el id del deploy; nunca se imprime el token.
          grep -o '"deployment_uuid":"[^"]*"' respuesta.json || cat respuesta.json
          if [ "$code" -ge 300 ]; then
            echo "::error::Coolify no aceptó el deploy (HTTP $code). 401 = token inválido (equipo War, permiso deploy); 404 = UUID de la app o URL; 405 = método."
            exit 1
          fi
